name: NoamFinance
options:
  bundleIdPrefix: app.noamfinance
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: W8P2Q5W8GA
targets:
  NoamFinance:
    type: application
    platform: iOS
    sources:
      - path: NoamFinance
        excludes:
          - Info.plist
          - NoamFinance.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noamfinance.ios
        PRODUCT_NAME: NoamFinance
        INFOPLIST_FILE: NoamFinance/Info.plist
        CODE_SIGN_ENTITLEMENTS: NoamFinance/NoamFinance.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Noam Finance
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "פתיחת האפליקציה באמצעות Face ID"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
  Notes:
    type: application
    platform: iOS
    sources:
      - path: NoamFinance
        excludes:
          - Info.plist
          - NoamFinance.entitlements
          - Assets.xcassets
      - path: Notes
        excludes:
          - Info.plist
          - Notes.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noamfinance.notes
        PRODUCT_NAME: Notes
        INFOPLIST_FILE: Notes/Info.plist
        CODE_SIGN_ENTITLEMENTS: Notes/Notes.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: פתקים
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "פתיחת האפליקציה באמצעות Face ID"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
